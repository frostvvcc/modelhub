version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: modelhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-modelhub123}
      MYSQL_DATABASE: ${DB_DATABASE:-modelhub}
      MYSQL_USER: ${DB_USERNAME:-modelhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-modelhub123}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - modelhub_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-modelhub123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: modelhub-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - modelhub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    container_name: modelhub-chromadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8002}:8000"
    volumes:
      - modelhub_chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: modelhub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - modelhub_es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      bash -c "
        if ! elasticsearch-plugin list | grep -q analysis-ik; then
          elasticsearch-plugin install --batch https://get.infini.cloud/elasticsearch/analysis-ik/8.15.0 || true;
        fi &&
        /usr/local/bin/docker-entrypoint.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
    container_name: modelhub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-modelhub}
      DB_USERNAME: ${DB_USERNAME:-modelhub}
      DB_PASSWORD: ${DB_PASSWORD:-modelhub123}
      SECRET_KEY: ${SECRET_KEY:-modelhub-dev-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      CHROMA_SERVER_HOST: chromadb
      CHROMA_SERVER_PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      ES_ENABLED: "true"
      ES_URL: http://elasticsearch:9200
      RAG_USE_ENHANCED: "true"
      RAG_USE_REWRITE: "true"
      RAG_USE_RERANK: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      INIT_SAMPLE_DATA: ${INIT_SAMPLE_DATA:-false}
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    volumes:
      - modelhub_uploads:/app/uploads
      - modelhub_backend_data:/app/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    command: >
      sh -c "python -m alembic upgrade head &&
             if [ \"$${INIT_SAMPLE_DATA}\" = \"true\" ]; then python scripts/init_sample_data.py; fi &&
             gunicorn main_fastapi:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:5000 --timeout 120 --graceful-timeout 30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
    container_name: modelhub-celery-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-modelhub}
      DB_USERNAME: ${DB_USERNAME:-modelhub}
      DB_PASSWORD: ${DB_PASSWORD:-modelhub123}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      CHROMA_SERVER_HOST: chromadb
      CHROMA_SERVER_PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_REDIS_DB: 1
      NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-modelhub123}
    volumes:
      - modelhub_uploads:/app/uploads
      - modelhub_backend_data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2

  neo4j:
    image: neo4j:5-community
    container_name: modelhub-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-modelhub123}
    volumes:
      - modelhub_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: modelhub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  modelhub_mysql_data:
  modelhub_redis_data:
  modelhub_chroma_data:
  modelhub_uploads:
  modelhub_backend_data:
  modelhub_neo4j_data:
  modelhub_es_data:
