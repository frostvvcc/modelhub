[project]
name = "modelhub-backend"
version = "2.0.0"
description = "AI 模型管理与对话平台 - FastAPI 版本"
requires-python = ">=3.9"
dependencies = [
    # FastAPI 核心依赖
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "python-multipart==0.0.9",
    # 数据库
    "sqlalchemy==2.0.23",
    "alembic==1.16.1",
    # 使用 PyMySQL 替代 mysqlclient（纯 Python，无需编译）
    # 如果需要 mysqlclient，需要先安装 MySQL 客户端库: brew install mysql pkg-config
    "PyMySQL>=1.1.0",
    # 异步数据库驱动
    "aiomysql==0.2.0",
    # 认证和安全
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    # 配置管理
    "pydantic==2.11.5",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.1.0",
    # 数据验证
    "email-validator==2.2.0",
    # AI 和向量数据库
    "chromadb>=0.5.17",
    "langchain==0.3.25",
    "llama-index==0.12.42",
    "llama-index-vector-stores-chroma>=0.3.0",
    "openai==1.86.0",
    # 缓存
    "redis==4.6.0",
    # 文件处理
    "python-docx==0.8.11",
    "PyPDF2==3.0.1",
    "pypdf==5.6.0",
    "openpyxl>=3.1.0",       # Excel 解析
    "python-pptx>=0.6.23",   # PPT 解析
    # 混合检索
    "rank-bm25>=0.2.2",      # BM25 关键词检索
    # 其他工具
    "requests==2.32.4",
    "aiofiles>=25.1.0",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-asyncio==0.23.8",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "aiosqlite>=0.19.0",
]
# sentence-transformers 需要 torch，但 torch 2.0+ 不支持 Intel Mac
# 对于 Intel Mac，需要先使用 conda 安装: conda install pytorch -c pytorch
# 然后安装: uv pip install sentence-transformers==2.2.2
ml = [
    "sentence-transformers==2.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

